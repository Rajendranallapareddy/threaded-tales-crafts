<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Threaded Tales Craft — Virtual Gallery</title>
<style>
:root{--cream:#f4ecdf;--ivory:#fbf7ef;--brown:#4a3526;--gold:#b08d4f;--ink:#2e221a;--line:#d9cbb5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,serif;overflow:hidden}
canvas{display:block;position:fixed;inset:0;touch-action:none;cursor:grab}
.ui{position:fixed;z-index:5;pointer-events:none}.ui *{pointer-events:auto}
button,.btn{font:600 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--brown);background:rgba(251,247,239,.92);color:var(--brown);min-height:44px;padding:10px 16px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,button.on,.btn.pri,button.pri{background:var(--brown);color:var(--ivory)}
#brand{top:calc(14px + env(safe-area-inset-top,0px));left:18px;line-height:1;pointer-events:none}#brand b{font-weight:400;font-size:21px;display:block}#brand span{font:600 10px system-ui;letter-spacing:.5em;color:var(--gold)}#loc{font:11px system-ui;letter-spacing:.1em;text-transform:uppercase;color:#7a6556;margin-top:8px}
#cartbtn{top:calc(10px + env(safe-area-inset-top,0px));right:14px}#cartbtn b{background:var(--gold);color:#fff;border-radius:99px;padding:2px 7px;font-size:11px}
#panel{left:0;right:0;bottom:0;background:rgba(251,247,239,.97);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(74,53,38,.18);transform:translateY(40px);opacity:0;visibility:hidden;transition:.45s}
#panel.open{transform:none;opacity:1;visibility:visible}
#panel small{font:600 10px system-ui;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}#panel h2{font-weight:400;margin:4px 0;font-size:22px;padding-right:44px}
#pd{margin:0 0 10px;font:13px/1.5 system-ui;color:#5a483a}.prow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.price{font:600 26px Georgia;color:var(--gold)}
.nav{display:flex;gap:6px}.nav button{width:44px;padding:0}.acts{display:flex;gap:8px}.acts button{flex:1}
#x{position:absolute;top:10px;right:12px;width:44px;padding:0;font-size:18px;letter-spacing:0}
@media(min-width:700px){#panel{left:20px;right:auto;bottom:20px;width:370px;border-radius:18px;border:1px solid var(--line)}}
#dock{right:14px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
@media(max-width:699px){#panel.open ~ #dock,#panel.open ~ #stick{display:none}}
#stick{left:20px;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border-radius:50%;background:rgba(251,247,239,.55);border:1px solid rgba(74,53,38,.35);backdrop-filter:blur(6px);touch-action:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--brown);opacity:.85;pointer-events:none}
@media(pointer:coarse){#stick{display:block}}
#hint{left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));width:80%;text-align:center;font:11px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--brown);opacity:.75;pointer-events:none;transition:opacity 1s}
@media(pointer:fine){#hint{bottom:18px}}
#dir{right:14px;bottom:calc(24px + env(safe-area-inset-bottom,0px) + 190px);background:rgba(251,247,239,.97);border:1px solid var(--line);border-radius:16px;padding:12px;display:none;width:min(300px,calc(100vw - 28px));max-height:60vh;overflow:auto}#dir.open{display:block}
#dir h4{margin:2px 4px 8px;font:600 10px system-ui;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.rm{width:100%;justify-content:space-between;border-radius:12px;margin-bottom:6px;text-align:left;letter-spacing:.03em;text-transform:none;font-weight:500;font-size:13px}.rm i{font-style:normal;opacity:.6;font-size:11px}.rm.on{background:var(--brown);color:var(--ivory)}.rm.hall{border-color:var(--gold)}
#fade{position:fixed;inset:0;background:var(--cream);z-index:15;opacity:0;pointer-events:none;transition:opacity .5s}#fade.on{opacity:1;pointer-events:auto}
#toast{left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--brown);color:var(--ivory);font:13px system-ui;padding:10px 16px;border-radius:99px;opacity:0;transition:.4s;pointer-events:none}#toast.on{opacity:1}
#intro{position:fixed;inset:0;z-index:20;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity 1.1s,visibility 1.1s}#intro.gone{opacity:0;visibility:hidden}
#intro h1{font-weight:400;font-size:clamp(34px,8vw,64px);margin:0}#intro h1+span{font:600 12px system-ui;letter-spacing:.7em;color:var(--gold);margin:10px 0 0 .7em}
#bar{width:160px;height:1px;background:var(--line);margin:32px 0 22px;position:relative;overflow:hidden}#bar i{position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s}#intro button{opacity:0;transition:opacity .6s}#intro button.show{opacity:1}
#modal,#admin{position:fixed;inset:0;z-index:30;background:rgba(46,34,26,.45);display:none;align-items:flex-end;justify-content:center}#modal.open,#admin.open{display:flex}
.card{background:var(--ivory);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));font:14px/1.5 system-ui}
@media(min-width:700px){#modal,#admin{align-items:center}.card{border-radius:20px}}
.card h3{font:400 24px Georgia;margin:0 0 12px}.card input,.card select,.card textarea{width:100%;font:16px system-ui;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:4px 0 10px;color:var(--ink)}
.card label{font:600 11px system-ui;letter-spacing:.1em;text-transform:uppercase;color:#7a6556}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.line .t{flex:1}.line img{width:44px;height:52px;object-fit:contain;background:#f4ecdf;border-radius:8px}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:36px;min-height:36px;padding:0}.total{display:flex;justify-content:space-between;font:600 18px Georgia;margin:12px 0}
.tabs{display:flex;gap:8px;margin-bottom:12px}.row2{display:flex;gap:8px}.row2>*{flex:1}.mut{color:#7a6556;font-size:12px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style></head><body>
<div id="intro"><h1>Threaded Tales</h1><span>CRAFT</span><div id="bar"><i></i></div><button id="enter">Enter the gallery</button></div>
<div id="fade"></div>
<div class="ui" id="brand"><b>Threaded Tales</b><span>CRAFT</span><div id="loc"></div></div>
<div class="ui" id="cartbtn"><button id="bCart">Cart <b id="cn">0</b></button></div>
<div class="ui" id="toast"></div>
<div class="ui" id="panel"><button id="x" aria-label="Close">✕</button><small id="pc"></small><h2 id="pt"></h2><p id="pd"></p>
<div class="prow"><div class="price" id="pp"></div><div class="nav"><button id="prev" aria-label="Previous">‹</button><button id="next" aria-label="Next">›</button></div></div>
<div class="acts"><button id="add">Add to cart</button><button class="pri" id="now">Order now</button></div></div>
<div class="ui" id="stick"><div id="knob"></div></div>
<div class="ui" id="dock"><button id="bRooms">Rooms</button><button id="bHall">View all</button><button id="bTour">Guided tour</button><button id="bAdmin" style="display:none">Admin</button></div>
<div class="ui" id="dir"></div>
<div class="ui" id="hint">Drag to look · joystick / WASD to walk · tap a piece</div>
<div id="modal"><div class="card" id="mc"></div></div>
<div id="admin"><div class="card" id="ac"></div></div>

  let saved=false;if(db){try{await db.collection('orders').add(order);saved=true}catch(e){}}
  const msg=`New order — Threaded Tales Craft\n${items.map(x=>`• ${x.title} × ${x.qty} = ${money(x.price*x.qty)}`).join('\n')}\nTotal: ${money(total)}\nName: ${name}\nPhone: ${phone}\nAddress: ${addr}${order.note?'\nNote: '+order.note:''}`;
  cart={};saveCart();mc.innerHTML=`<h3>Thank you, ${esc(name)}!</h3><p>${saved?'Your order has been recorded. ':''}Tap below to send your order details to us on WhatsApp so we can confirm payment and delivery.</p><a class="btn pri" style="width:100%" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}">Send on WhatsApp</a><br><br><button data-a="close" style="width:100%">Back to gallery</button>`}};
/* ================= ADMIN (add / update / delete products) ================= */
const adm=$('admin'),ac=$('ac');adm.onclick=e=>{if(e.target===adm)adm.classList.remove('open')};
let aTab='p',editing=null;
$('bAdmin').onclick=()=>{adm.classList.add('open');renderAdmin()};
const roomOpts=sel=>ROOMS.map(r=>`<option value="${r.id}" ${sel===r.id?'selected':''}>${esc(r.name)}</option>`).join('');
function renderAdmin(){
 const tabs=`<div class="tabs"><button class="${aTab==='p'?'on':''}" data-t="p">Products</button><button class="${aTab==='o'?'on':''}" data-t="o">Orders (${orders.filter(o=>o.status==='new').length})</button><button data-t="x" style="margin-left:auto">Close</button></div>`;
 if(aTab==='o'){ac.innerHTML=tabs+'<h3>Orders</h3>'+(orders.length?orders.map(o=>`<div class="line" style="align-items:flex-start"><div class="t"><b>${esc(o.name)}</b> · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>${(o.items||[]).map(i=>`${esc(i.title)} × ${i.qty}`).join(', ')}<br><b>${money(o.total)}</b> · <span class="mut">${new Date(o.createdAt).toLocaleString()}</span><br><span class="mut">${esc(o.address)} ${esc(o.note||'')}</span></div><div><select data-o="${o.id}">${['new','confirmed','delivered'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><button data-del-o="${o.id}" style="min-height:36px">Delete</button></div></div>`).join(''):'<p class="mut">No orders yet.</p>');return}
 if(editing){const p=editing;ac.innerHTML=tabs+`<h3>${p.id?'Edit':'Add'} product</h3><label>Title</label><input id="ft" value="${esc(p.title||'')}"><label>Price (${CONFIG.cur})</label><input id="fp" type="number" inputmode="numeric" value="${p.price??''}"><label>Room</label><select id="fr">${roomOpts(p.room||view)}</select><label>Category</label><input id="fc" value="${esc(p.category||'')}"><label>Description</label><textarea id="fd" rows="3">${esc(p.desc||'')}</textarea><label>Photo ${p.id?'(leave empty to keep current)':''}</label><input id="ff" type="file" accept="image/*"><label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0"><input id="fb" type="checkbox" checked style="width:auto;margin:0"> Remove plain black / white background</label><br><div class="row2"><button data-a2="cancel">Cancel</button>${p.id?'<button data-a2="del">Delete</button>':''}<button class="pri" data-a2="save">Save</button></div>`;return}
 ac.innerHTML=tabs+`<div class="row2" style="margin-bottom:10px"><button class="pri" data-a2="new">+ Add product</button>${seeded?'':'<button data-a2="seed">Save starter products</button>'}</div>`+products.map(p=>`<div class="line"><img src="${esc(IMGS[p.img]||p.img)}" alt=""><div class="t"><b>${esc(p.title)}</b><br><span class="mut">${money(p.price)} · ${esc(roomName(p.room))}</span></div><button data-edit="${p.id}" style="min-height:36px">Edit</button></div>`).join('')||'<p class="mut">No products yet.</p>'}
function removeBg(file){return new Promise(res=>{const im=new Image();im.onload=()=>{const s=Math.min(1,720/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h),a=d.data,seen=new Uint8Array(w*h),q=[];
 const bg=i=>{const r=a[i*4],g=a[i*4+1],b=a[i*4+2];return Math.max(r,g,b)<30||Math.min(r,g,b)>238};for(let i=0;i<w;i++)q.push(i,(h-1)*w+i);for(let j=0;j<h;j++)q.push(j*w,j*w+w-1);
 while(q.length){const i=q.pop();if(seen[i]||!bg(i))continue;seen[i]=1;a[i*4+3]=0;const px=i%w;if(px>0)q.push(i-1);if(px<w-1)q.push(i+1);if(i>=w)q.push(i-w);if(i<w*(h-1))q.push(i+w)}
 let x0=w,y0=h,x1=0,y1=0;for(let i=0;i<w*h;i++)if(!seen[i]){const px=i%w,py=(i/w)|0;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py}
 x.putImageData(d,0,0);if(x1<=x0||y1<=y0)return c.toBlob(res,'image/png');const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);o.toBlob(res,'image/png')};im.src=URL.createObjectURL(file)})}
ac.onclick=async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.t){if(d.t==='x')adm.classList.remove('open');else{aTab=d.t;editing=null;renderAdmin()}return}
 if(d.edit){editing={...products.find(p=>p.id===d.edit)};renderAdmin();return}
 if(d.delO){if(confirm('Delete this order?'))await db.collection('orders').doc(d.delO).delete();return}
 const a=d.a2;if(!a)return;
 if(a==='new'){editing={room:view==='hall'?'r1':view};renderAdmin()}
 if(a==='cancel'){editing=null;renderAdmin()}
 if(a==='seed'){try{for(const p of DEFAULTS){const{id,...r}=p;await db.collection('products').doc(id).set(r)}await db.doc('meta/shop').set({seeded:true});toast('Starter products saved')}catch(err){toast('Could not save: '+(err.message||err.code))}}
 if(a==='del'&&confirm('Delete this product from the gallery?')){try{await db.collection('products').doc(editing.id).delete();if(!seeded)await db.doc('meta/shop').set({seeded:true});editing=null;toast('Deleted');renderAdmin()}catch(err){toast('Could not delete')}}
 if(a==='save'){const title=$('ft').value.trim(),price=Number($('fp').value);if(!title||!(price>=0)||$('fp').value===''){toast('Title and price are required');return}
  b.disabled=true;b.textContent='Saving…';try{let img=editing.img||'';const f=$('ff').files[0];
   if(f){const blob=$('fb').checked?await removeBg(f):f,as=await claude.use('assets');if(!as){toast('Photo upload needs editor access');b.disabled=false;return}img=(await as.upload(blob)).url}
   if(!img){toast('Please choose a photo');b.disabled=false;b.textContent='Save';return}
   const id=editing.id||('p'+Date.now().toString(36));if(!seeded&&!products.some(p=>p.id!==id&&!DEFAULTS.find(x=>x.id===p.id))){}
   await db.collection('products').doc(id).set({title,price,room:$('fr').value,category:$('fc').value.trim(),desc:$('fd').value.trim(),img,order:editing.order??Date.now()});
   if(!seeded)await db.doc('meta/shop').set({seeded:true});editing=null;toast('Saved ✓');renderAdmin()}catch(err){toast('Could not save: '+(err.message||err.code));b.disabled=false;b.textContent='Save'}}};
ac.onchange=async e=>{const s=e.target.dataset.o;if(s)await db.collection('orders').doc(s).update({status:e.target.value})};
/* ================= BACKEND (shared db, admin = editor/owner) ================= */
let sig='';function applyProducts(){const s=JSON.stringify(products.map(p=>[p.id,p.title,p.price,p.room,p.img,p.desc,p.category]));if(s===sig)return;sig=s;buildRoom();if(S.focus>=0){S.focus=-1;$('panel').classList.remove('open')}if(adm.classList.contains('open'))renderAdmin()}
(async()=>{if(!(window.claude&&claude.use))return;try{const user=await claude.use('user');isAdmin=!!user&&await user.canEdit();db=await claude.use('db')}catch(e){}
 if(!db)return;if(isAdmin)$('bAdmin').style.display='';
 db.doc('meta/shop').onSnapshot(s=>{seeded=!!(s.exists&&s.data().seeded);if(adm.classList.contains('open'))renderAdmin()},()=>{});
 db.collection('products').onSnapshot(s=>{if(!s.empty)products=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));else products=seeded?[]:DEFAULTS.slice();applyProducts()},()=>{});
 if(isAdmin)db.collection('orders').onSnapshot(s=>{orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt-a.createdAt);if(adm.classList.contains('open')&&aTab==='o')renderAdmin()},()=>{})})();
</script></body></html>
